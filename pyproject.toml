[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bvr-motion-viewer"
version = "0.1.0"
description = "Visualise bone motion tracked in Autoscoper / SlicerAutoscoperM from biplanar videoradiography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "PySide6>=6.5",
    "tifffile>=2023.1",
    "imagecodecs>=2023.1",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "pyinstaller>=6"]

[project.gui-scripts]
bvr-viewer = "bvrviewer.app.main:main"

[tool.setuptools.packages.find]
include = ["bvrviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
